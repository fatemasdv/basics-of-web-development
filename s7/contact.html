<!DOCTYPE html>
<html lang="en">
<head>
  <!--

  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basics of Web Development - Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <span class="logo-centria">centria</span> <span class="logo-edu">edu</span>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="#">Topics</a>
        <a href="#">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="topics" id="contact">
      <div class="hero">
        <p class="tagline">GET IN TOUCH</p>
        <h1>Contact us</h1>
        <p class="subtitle">Please fill out the form below to send us a message. All required fields are marked.</p>
      </div>

      <!-- Contact Form styled as a card submitting to httpbin via POST -->
      <form class="card form-card" action="https://httpbin.org/post" method="post">
        
        <!-- 1. Name -->
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" autocomplete="name" required placeholder="Enter your full name">
        </div>

        <!-- 2. Email -->
        <div class="form-group">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="name@example.com">
        </div>

        <!-- 3. Phone -->
        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+358 40 1234567">
        </div>

        <!-- 4. Contact Subject -->
        <div class="form-group">
          <label for="subject">Contact subject *</label>
          <select id="subject" name="subject" required>
            <option value="">Choose a subject</option>
            <option value="feedback">Feedback</option>
            <option value="question">Question</option>
            <option value="collaboration">Collaboration</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- 5. Preferred Contact Method -->
        <div class="form-group">
          <span class="radio-title">Preferred contact method:</span>
          <div class="radio-options">
            <label class="radio-label">
              <input type="radio" name="preferred_contact" value="email" checked>
              Email
            </label>
            <label class="radio-label">
              <input type="radio" name="preferred_contact" value="phone">
              Phone
            </label>
          </div>
        </div>

        <!-- 6. Message -->
        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
        </div>

        <!-- 7. Submit button -->
        <div class="form-group">
          <button type="submit" class="submit-btn">Send Message</button>
        </div>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Centria UAS | Modified by Fatema Akter</p>
  </footer>
</body>
</html>
